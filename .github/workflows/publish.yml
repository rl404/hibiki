name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/package/Dockerfile
          push: false
          tags: hibiki:build
          outputs: type=docker,dest=/tmp/hibiki.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: hibiki-image
          path: /tmp/hibiki.tar
          retention-days: 1
  publish_dockerhub:
    name: Publish Dockerhub
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hibiki-image
          path: /tmp
      - name: Load image
        run: docker load --input /tmp/hibiki.tar
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: rl404/hibiki
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Tag and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag hibiki:build "$tag"
            docker push "$tag"
          done
  publish_github:
    name: Publish Github
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hibiki-image
          path: /tmp
      - name: Load image
        run: docker load --input /tmp/hibiki.tar
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rl404/hibiki
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Tag and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag hibiki:build "$tag"
            docker push "$tag"
          done
  publish_gcr:
    name: Publish GCR
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hibiki-image
          path: /tmp
      - name: Load image
        run: docker load --input /tmp/hibiki.tar
      - id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          token_format: access_token
      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.GCR_HOSTNAME }}
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/hibiki
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Tag and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag hibiki:build "$tag"
            docker push "$tag"
          done
